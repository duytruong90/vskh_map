<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="westGround" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a66b"/>
      <stop offset="45%" stop-color="#b8935a"/>
      <stop offset="100%" stop-color="#9c7a45"/>
    </linearGradient>
    <linearGradient id="eastGround" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d9b5a"/>
      <stop offset="50%" stop-color="#7d8c4e"/>
      <stop offset="100%" stop-color="#66753d"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6f8fa0"/>
      <stop offset="50%" stop-color="#9dc0cf"/>
      <stop offset="100%" stop-color="#6f8fa0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a1206" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <circle cx="1" cy="1" r="0.7" fill="#000" opacity="0.05"/>
      <circle cx="4" cy="3.5" r="0.6" fill="#fff" opacity="0.05"/>
    </pattern>
    <g id="pine">
      <path d="M0 6 L-5 6 L0 -9 L5 6 Z" fill="#3f5a2e"/>
      <path d="M0 1 L-4 1 L0 -11 L4 1 Z" fill="#4d6d38"/>
      <rect x="-1" y="5" width="2" height="4" fill="#3a2c18"/>
    </g>
    <g id="rock">
      <path d="M-14 8 L-6 -7 L2 -2 L10 -9 L16 8 Z" fill="#8a6f45" stroke="#6d552f" stroke-width="1.5"/>
      <path d="M-6 -7 L-2 8 M10 -9 L8 8" stroke="#6d552f" stroke-width="1.2" fill="none" opacity="0.7"/>
    </g>
    <g id="hut">
      <rect x="-9" y="-4" width="18" height="12" fill="#8b6b41" stroke="#5b4426" stroke-width="1.5"/>
      <path d="M-12 -4 L0 -13 L12 -4 Z" fill="#6d5230" stroke="#4a3620" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#westGround)"/>
  <path d="M820 0 L1600 0 L1600 1000 L760 1000 Z" fill="url(#eastGround)"/>

  <!-- river -->
  <path d="M792 0 C 760 180, 840 330, 800 500 C 762 665, 838 830, 806 1000 L 872 1000 C 902 830, 828 665, 866 500 C 906 330, 826 180, 858 0 Z" fill="url(#river)" opacity="0.92"/>
  <path d="M825 0 C 793 180, 873 330, 833 500 C 795 665, 871 830, 839 1000" stroke="#cfe6ef" stroke-width="3" fill="none" opacity="0.45"/>

  <!-- roads -->
  <g stroke="#e6d5ab" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M60 620 C 300 560, 520 640, 700 560 C 780 522, 800 500, 845 498"/>
    <path d="M845 498 C 950 496, 1060 566, 1240 540 C 1400 518, 1500 470, 1560 430"/>
    <path d="M300 120 C 380 300, 520 380, 610 560"/>
    <path d="M1290 140 C 1240 300, 1180 400, 1120 520"/>
    <path d="M420 940 C 520 820, 620 760, 700 660"/>
    <path d="M1180 930 C 1120 810, 1080 720, 1040 630"/>
  </g>
  <g stroke="#b9a071" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="10 12">
    <path d="M60 620 C 300 560, 520 640, 700 560 C 780 522, 800 500, 845 498"/>
    <path d="M845 498 C 950 496, 1060 566, 1240 540 C 1400 518, 1500 470, 1560 430"/>
  </g>

  <!-- west mountains -->
  <g opacity="0.85">
    <use href="#rock" x="180" y="300" transform="translate(180,300) scale(2.4) translate(-180,-300)"/>
    <use href="#rock" x="420" y="220" transform="translate(420,220) scale(2.0) translate(-420,-220)"/>
    <use href="#rock" x="300" y="760" transform="translate(300,760) scale(2.2) translate(-300,-760)"/>
    <use href="#rock" x="600" y="840" transform="translate(600,840) scale(1.8) translate(-600,-840)"/>
    <use href="#rock" x="640" y="330" transform="translate(640,330) scale(1.7) translate(-640,-330)"/>
    <use href="#rock" x="120" y="470" transform="translate(120,470) scale(1.6) translate(-120,-470)"/>
  </g>

  <!-- east forest -->
  <g opacity="0.9">
    <use href="#pine" transform="translate(1010,300) scale(2.1)"/>
    <use href="#pine" transform="translate(1060,350) scale(1.7)"/>
    <use href="#pine" transform="translate(980,390) scale(1.9)"/>
    <use href="#pine" transform="translate(1300,690) scale(2.0)"/>
    <use href="#pine" transform="translate(1350,740) scale(1.6)"/>
    <use href="#pine" transform="translate(1250,760) scale(1.8)"/>
    <use href="#pine" transform="translate(920,820) scale(1.9)"/>
    <use href="#pine" transform="translate(1480,260) scale(1.8)"/>
    <use href="#pine" transform="translate(1420,320) scale(1.5)"/>
  </g>

  <!-- settlements -->
  <g opacity="0.9">
    <use href="#hut" transform="translate(240,180) scale(1.6)"/>
    <use href="#hut" transform="translate(300,215) scale(1.3)"/>
    <use href="#hut" transform="translate(190,215) scale(1.2)"/>
    <use href="#hut" transform="translate(1330,200) scale(1.6)"/>
    <use href="#hut" transform="translate(1390,235) scale(1.3)"/>
    <use href="#hut" transform="translate(470,880) scale(1.4)"/>
    <use href="#hut" transform="translate(1130,880) scale(1.4)"/>
  </g>

  <!-- strongholds -->
  <g>
    <rect x="60" y="430" width="150" height="150" rx="6" fill="#7d6234" stroke="#4d3a1c" stroke-width="6"/>
    <rect x="92" y="462" width="86" height="86" rx="4" fill="#94764a" stroke="#4d3a1c" stroke-width="5"/>
    <rect x="1400" y="420" width="150" height="150" rx="6" fill="#5f6f3c" stroke="#3a4524" stroke-width="6"/>
    <rect x="1432" y="452" width="86" height="86" rx="4" fill="#74874a" stroke="#3a4524" stroke-width="5"/>
  </g>

  <!-- objective markers -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" fill="#f2e4c2" stroke="#3a2c14" stroke-width="5" paint-order="stroke" letter-spacing="4">
    <text x="470" y="470" font-size="42">KHO VŨ KHÍ</text>
    <text x="470" y="700" font-size="42">LÒ RÈN</text>
    <text x="1140" y="410" font-size="42">TRẠI GỖ</text>
    <text x="1140" y="720" font-size="42">KHO LƯƠNG</text>
    <text x="135" y="405" font-size="28" letter-spacing="2" text-anchor="middle">THÀNH TÂY</text>
    <text x="1475" y="395" font-size="28" letter-spacing="2" text-anchor="middle">THÀNH ĐÔNG</text>
  </g>
  <g fill="none" stroke="#f2e4c2" stroke-width="4" opacity="0.85">
    <circle cx="430" cy="455" r="18"/><path d="M420 447 l20 16 M440 447 l-20 16"/>
    <circle cx="430" cy="685" r="18"/><path d="M422 693 l16 -16 M430 677 v16"/>
    <circle cx="1100" cy="395" r="18"/><path d="M1090 403 l20 -16 M1092 387 h18"/>
    <circle cx="1100" cy="705" r="18"/><path d="M1090 697 h20 M1090 711 h20 M1097 690 v26 M1105 690 v26"/>
  </g>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect x="8" y="8" width="1584" height="984" fill="none" stroke="#2b1f0e" stroke-width="6" opacity="0.5" rx="10"/>
</svg>
